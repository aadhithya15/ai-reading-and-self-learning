<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
<marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker>
<marker id="arg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker>
</defs>
<rect width="980" height="620" fill="#ffffff"/>

<text x="490.0" y="28" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="bold">Diagram 3 — Evidence gate and abstention: the four labelled outcomes</text>
<text x="490.0" y="47" text-anchor="middle" font-size="11" fill="#64748b" font-weight="normal">&#8220;I don't know&#8221; is not informative. The KIND of not-knowing is. Abstention is scored, and the attempted denominator is always published.</text>
<rect x="380" y="70" width="220" height="70" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="490" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">CLAIM + CANDIDATE EVIDENCE</text>
<text x="490" y="108" text-anchor="middle" font-size="11" fill="#334155">value, cited page,</text>
<text x="490" y="123" text-anchor="middle" font-size="11" fill="#334155">exact quote, doc version</text>
<rect x="380" y="175" width="220" height="70" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="490" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">GATE 1 — quote present?</text>
<text x="490" y="213" text-anchor="middle" font-size="11" fill="#334155">deterministic string search</text>
<text x="490" y="228" text-anchor="middle" font-size="11" fill="#334155">against the stored page text</text>
<rect x="380" y="285" width="220" height="70" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="490" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">GATE 2 — passage entails?</text>
<text x="490" y="323" text-anchor="middle" font-size="11" fill="#334155">small local NLI model, or rules</text>
<text x="490" y="338" text-anchor="middle" font-size="11" fill="#334155">(which was used is recorded)</text>
<rect x="380" y="395" width="220" height="70" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="490" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">GATE 3 — is the source current?</text>
<text x="490" y="433" text-anchor="middle" font-size="11" fill="#334155">validity interval covers query time?</text>
<text x="490" y="448" text-anchor="middle" font-size="11" fill="#334155">stale source excluded or flagged</text>
<rect x="380" y="505" width="220" height="70" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="490" y="525" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">EMIT ANSWER</text>
<text x="490" y="543" text-anchor="middle" font-size="11" fill="#334155">typed contract + evidence</text>
<text x="490" y="558" text-anchor="middle" font-size="11" fill="#334155">invented-parameter count must be 0</text>
<line x1="490" y1="140" x2="490" y2="173" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="490" y1="245" x2="490" y2="283" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="490" y1="355" x2="490" y2="393" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="490" y1="465" x2="490" y2="503" stroke="#15803d" stroke-width="1.6" marker-end="url(#arg)"/>
<rect x="30" y="175" width="300" height="90" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="180" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ABSTAIN: missing_information</text>
<text x="180" y="213" text-anchor="middle" font-size="11" fill="#334155">the source does not specify it</text>
<text x="180" y="228" text-anchor="middle" font-size="11" fill="#334155">record absent_from_source</text>
<text x="180" y="243" text-anchor="middle" font-size="11" fill="#334155">NEVER substitute a library default</text>
<rect x="30" y="285" width="300" height="90" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="180" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ABSTAIN: partial_constraint</text>
<text x="180" y="323" text-anchor="middle" font-size="11" fill="#334155">only part of it is specified</text>
<text x="180" y="338" text-anchor="middle" font-size="11" fill="#334155">record partially_specified</text>
<text x="180" y="353" text-anchor="middle" font-size="11" fill="#334155">PRESERVE what is known; do not complete it</text>
<rect x="30" y="395" width="300" height="90" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="180" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ABSTAIN: unsupported_interpretation</text>
<text x="180" y="433" text-anchor="middle" font-size="11" fill="#334155">a quote exists but does NOT entail</text>
<text x="180" y="448" text-anchor="middle" font-size="11" fill="#334155">the claim — the named trap</text>
<text x="180" y="463" text-anchor="middle" font-size="11" fill="#334155">ALCE: even good systems ~50% incomplete</text>
<rect x="30" y="505" width="300" height="90" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="180" y="525" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ABSTAIN: genuine_contradiction</text>
<text x="180" y="543" text-anchor="middle" font-size="11" fill="#334155">two sources truly conflict</text>
<text x="180" y="558" text-anchor="middle" font-size="11" fill="#334155">flag the pair, never merge</text>
<text x="180" y="573" text-anchor="middle" font-size="11" fill="#334155">distinct from a scope/version difference</text>
<line x1="378" y1="210" x2="332" y2="215" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="378" y1="320" x2="332" y2="325" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="378" y1="430" x2="332" y2="435" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="378" y1="540" x2="332" y2="545" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="650" y="175" width="300" height="130" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="800" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ALSO ABSTAIN WHEN</text>
<text x="800" y="213" text-anchor="middle" font-size="11" fill="#334155">the query has no answer in the corpus</text>
<text x="800" y="228" text-anchor="middle" font-size="11" fill="#334155">retrieval failed although the fact exists</text>
<text x="800" y="243" text-anchor="middle" font-size="11" fill="#334155">   (report retrieval_error, not &#8220;absent&#8221;)</text>
<text x="800" y="258" text-anchor="middle" font-size="11" fill="#334155">the resource budget is exhausted mid-query</text>
<text x="800" y="273" text-anchor="middle" font-size="11" fill="#334155">   (degrade -&gt; refuse, and log it)</text>
<text x="800" y="288" text-anchor="middle" font-size="11" fill="#334155">the document could not be extracted</text>
<text x="800" y="303" text-anchor="middle" font-size="11" fill="#334155">   (image-only / failed page states)</text>
<rect x="650" y="340" width="300" height="155" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="800" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">SCORED, NOT PENALISED</text>
<text x="800" y="378" text-anchor="middle" font-size="11" fill="#334155">abstention rate</text>
<text x="800" y="393" text-anchor="middle" font-size="11" fill="#334155">correct abstentions (unanswerable items)</text>
<text x="800" y="408" text-anchor="middle" font-size="11" fill="#334155">incorrect abstentions (answerable items)</text>
<text x="800" y="423" text-anchor="middle" font-size="11" fill="#334155">attempted denominator, published</text>
<text x="800" y="438" text-anchor="middle" font-size="11" fill="#334155">next to EVERY rate</text>
<text x="800" y="468" text-anchor="middle" font-size="11" fill="#334155">accuracy that improves while the</text>
<text x="800" y="483" text-anchor="middle" font-size="11" fill="#334155">denominator shrinks = gaming -&gt; REJECT</text>
<line x1="600" y1="210" x2="648" y2="215" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="490.0" y="600" text-anchor="middle" font-size="10" fill="#64748b" font-weight="normal">Gate order is cheapest and most objective first: deterministic -&gt; entailment -&gt; model judge (meaning only, never the acceptance gate). See EVALUATION_PLAN.md §4.</text>
</svg>