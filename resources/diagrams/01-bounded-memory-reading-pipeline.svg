<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
<marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker>
<marker id="arg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker>
</defs>
<rect width="980" height="700" fill="#ffffff"/>

<text x="490.0" y="28" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="bold">Diagram 1 — SAM-X bounded-memory reading pipeline</text>
<text x="490.0" y="47" text-anchor="middle" font-size="11" fill="#64748b" font-weight="normal">PROPOSED design. Not built, not executed, not measured. All components are catalogued in RESOURCE_CATALOG.csv; all resource figures are estimates.</text>
<rect x="30" y="80" width="205" height="110" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="132" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">1. INGEST (untrusted)</text>
<text x="132" y="118" text-anchor="middle" font-size="11" fill="#334155">sandboxed, no network</text>
<text x="132" y="133" text-anchor="middle" font-size="11" fill="#334155">nsjail or OS rlimits</text>
<text x="132" y="148" text-anchor="middle" font-size="11" fill="#334155">timeout + file/page caps</text>
<text x="132" y="163" text-anchor="middle" font-size="11" fill="#334155">WS14</text>
<rect x="30" y="215" width="205" height="120" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="132" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">2. EXTRACT</text>
<text x="132" y="253" text-anchor="middle" font-size="11" fill="#334155">pypdf (BSD-3) structure</text>
<text x="132" y="268" text-anchor="middle" font-size="11" fill="#334155">pdfminer.six (MIT) layout</text>
<text x="132" y="283" text-anchor="middle" font-size="11" fill="#334155">disagreement = ERROR signal</text>
<text x="132" y="298" text-anchor="middle" font-size="11" fill="#334155">WS03</text>
<rect x="30" y="360" width="205" height="130" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="132" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">3. PAGE MAP</text>
<text x="132" y="398" text-anchor="middle" font-size="11" fill="#334155">page -&gt; byte range</text>
<text x="132" y="413" text-anchor="middle" font-size="11" fill="#334155">-&gt; heading path</text>
<text x="132" y="428" text-anchor="middle" font-size="11" fill="#334155">-&gt; SHA-256 of text</text>
<text x="132" y="443" text-anchor="middle" font-size="11" fill="#334155">coverage report published</text>
<text x="132" y="458" text-anchor="middle" font-size="11" fill="#334155">WS03</text>
<rect x="290" y="140" width="235" height="320" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="408" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">4. BOUNDED-MEMORY SPINE</text>
<text x="408" y="178" text-anchor="middle" font-size="11" fill="#334155">SQLite + FTS5 (stdlib)</text>
<text x="408" y="193" text-anchor="middle" font-size="11" fill="#334155">per-page extracted text</text>
<text x="408" y="208" text-anchor="middle" font-size="11" fill="#334155">sqlite-vec (optional dense)</text>
<text x="408" y="223" text-anchor="middle" font-size="11" fill="#334155">diskcache spill tier</text>
<text x="408" y="238" text-anchor="middle" font-size="11" fill="#334155">tiktoken exact token budgets</text>
<text x="408" y="253" text-anchor="middle" font-size="11" fill="#334155">psutil enforcement</text>
<text x="408" y="283" text-anchor="middle" font-size="11" fill="#334155">declared resident ceiling:</text>
<text x="408" y="298" text-anchor="middle" font-size="11" fill="#334155">breach -&gt; spill -&gt; degrade</text>
<text x="408" y="313" text-anchor="middle" font-size="11" fill="#334155">-&gt; refuse (always logged)</text>
<text x="408" y="343" text-anchor="middle" font-size="11" fill="#334155">WS01 / WS02</text>
<rect x="580" y="80" width="185" height="120" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
<text x="672" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">5a. LOCATE</text>
<text x="672" y="118" text-anchor="middle" font-size="11" fill="#334155">hierarchical summary</text>
<text x="672" y="133" text-anchor="middle" font-size="11" fill="#334155">(document / chapter / page)</text>
<text x="672" y="148" text-anchor="middle" font-size="11" fill="#334155">RAPTOR tree PATTERN</text>
<text x="672" y="163" text-anchor="middle" font-size="11" fill="#334155">summaries are HYPOTHESES</text>
<text x="672" y="178" text-anchor="middle" font-size="11" fill="#334155">WS05</text>
<rect x="580" y="225" width="185" height="115" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
<text x="672" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">5b. RETRIEVE</text>
<text x="672" y="263" text-anchor="middle" font-size="11" fill="#334155">lexical FIRST (FTS5 / BM25)</text>
<text x="672" y="278" text-anchor="middle" font-size="11" fill="#334155">dense second — only if</text>
<text x="672" y="293" text-anchor="middle" font-size="11" fill="#334155">lexical demonstrably fails</text>
<text x="672" y="308" text-anchor="middle" font-size="11" fill="#334155">WS05</text>
<rect x="580" y="365" width="185" height="120" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="672" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">5c. REOPEN</text>
<text x="672" y="403" text-anchor="middle" font-size="11" fill="#334155">re-read the cited page</text>
<text x="672" y="418" text-anchor="middle" font-size="11" fill="#334155">from the source of record</text>
<text x="672" y="433" text-anchor="middle" font-size="11" fill="#334155">verify the stored text hash</text>
<text x="672" y="448" text-anchor="middle" font-size="11" fill="#334155">matches the source</text>
<text x="672" y="463" text-anchor="middle" font-size="11" fill="#334155">WS03</text>
<rect x="800" y="145" width="155" height="240" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="878" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">6. EVIDENCE GATE</text>
<text x="878" y="183" text-anchor="middle" font-size="11" fill="#334155">is the quote literally</text>
<text x="878" y="198" text-anchor="middle" font-size="11" fill="#334155">on the cited page?</text>
<text x="878" y="213" text-anchor="middle" font-size="11" fill="#334155">(deterministic)</text>
<text x="878" y="243" text-anchor="middle" font-size="11" fill="#334155">does the passage</text>
<text x="878" y="258" text-anchor="middle" font-size="11" fill="#334155">ENTAIL the claim?</text>
<text x="878" y="288" text-anchor="middle" font-size="11" fill="#334155">if no -&gt; ABSTAIN</text>
<text x="878" y="303" text-anchor="middle" font-size="11" fill="#334155">with one of four</text>
<text x="878" y="318" text-anchor="middle" font-size="11" fill="#334155">labels (diagram 3)</text>
<text x="878" y="348" text-anchor="middle" font-size="11" fill="#334155">WS04 / WS05</text>
<rect x="290" y="500" width="475" height="95" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="528" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">7. ANSWER (typed contract)</text>
<text x="528" y="538" text-anchor="middle" font-size="11" fill="#334155">value + exact quote + page + document version + hash + field state</text>
<text x="528" y="553" text-anchor="middle" font-size="11" fill="#334155">field state: specified | partially_specified | absent_from_source | ambiguous</text>
<text x="528" y="568" text-anchor="middle" font-size="11" fill="#334155">INVENTED-PARAMETER COUNT MUST BE 0 — one invention fails the run</text>
<rect x="30" y="520" width="205" height="125" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="132" y="540" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">MEMORY STORES</text>
<text x="132" y="558" text-anchor="middle" font-size="11" fill="#334155">facts | procedures</text>
<text x="132" y="573" text-anchor="middle" font-size="11" fill="#334155">lessons | hypotheses</text>
<text x="132" y="588" text-anchor="middle" font-size="11" fill="#334155">valid_from / valid_to</text>
<text x="132" y="603" text-anchor="middle" font-size="11" fill="#334155">superseded_by</text>
<text x="132" y="618" text-anchor="middle" font-size="11" fill="#334155">diagram 2 · WS06</text>
<rect x="800" y="430" width="155" height="105" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="878" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">EVALUATION</text>
<text x="878" y="468" text-anchor="middle" font-size="11" fill="#334155">frozen candidate,</text>
<text x="878" y="483" text-anchor="middle" font-size="11" fill="#334155">items, keys, scorer</text>
<text x="878" y="498" text-anchor="middle" font-size="11" fill="#334155">immutable append-only log</text>
<text x="878" y="513" text-anchor="middle" font-size="11" fill="#334155">diagram 4 · WS08</text>
<rect x="800" y="560" width="155" height="85" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="878" y="580" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">RESOURCE TRACE</text>
<text x="878" y="598" text-anchor="middle" font-size="11" fill="#334155">out-of-process psutil</text>
<text x="878" y="613" text-anchor="middle" font-size="11" fill="#334155">RSS + PSS + available</text>
<text x="878" y="628" text-anchor="middle" font-size="11" fill="#334155">never self-reported</text>
<line x1="132" y1="190" x2="132" y2="213" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="132" y1="335" x2="132" y2="358" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="235" y1="425" x2="288" y2="385" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="525" y1="235" x2="578" y2="150" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="525" y1="300" x2="578" y2="280" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="672" y1="200" x2="672" y2="223" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="672" y1="340" x2="672" y2="363" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="765" y1="425" x2="798" y2="330" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="400" y1="460" x2="237" y2="555" stroke="#15803d" stroke-width="1.6" marker-end="url(#arg)"/>
<line x1="237" y1="600" x2="400" y2="560" stroke="#15803d" stroke-width="1.6" marker-end="url(#arg)"/>
<line x1="877" y1="385" x2="700" y2="498" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="877" y1="430" x2="877" y2="558" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="318" y="495" text-anchor="middle" font-size="10" fill="#15803d" font-weight="normal">cite only from facts,</text>
<text x="318" y="508" text-anchor="middle" font-size="10" fill="#15803d" font-weight="normal">never from hypotheses</text>
<text x="845" y="412" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="normal">abstain / reject</text>
<text x="490.0" y="628" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="bold">NOT SHOWN: trading, risk, approval, holding-rule and open-position safeguards. The reading path has NO tool</text>
<text x="490.0" y="644" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="bold">that can alter them (WS14 requirement 14.4) — structural containment, verified by code inspection.</text>
<text x="490.0" y="668" text-anchor="middle" font-size="10" fill="#64748b" font-weight="normal">Legend:  red = trust boundary or hard stop    green = storage / bounded resource    blue = document handling    yellow = retrieval    purple = output contract    grey = measurement</text>
</svg>