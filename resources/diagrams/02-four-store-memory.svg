<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
<marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker>
<marker id="arg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker>
</defs>
<rect width="980" height="640" fill="#ffffff"/>

<text x="490.0" y="28" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="bold">Diagram 2 — Four memory stores, write authority and temporal validity</text>
<text x="490.0" y="47" text-anchor="middle" font-size="11" fill="#64748b" font-weight="normal">The property that matters is WHO MAY WRITE, not the schema shape. PROPOSED; implemented in SQL, not in a graph database.</text>
<rect x="30" y="80" width="200" height="250" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="130" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">FACTS</text>
<text x="130" y="118" text-anchor="middle" font-size="11" fill="#334155">claim + exact quote</text>
<text x="130" y="133" text-anchor="middle" font-size="11" fill="#334155">source id + page</text>
<text x="130" y="148" text-anchor="middle" font-size="11" fill="#334155">document version + hash</text>
<text x="130" y="163" text-anchor="middle" font-size="11" fill="#334155">retrieval timestamp</text>
<text x="130" y="193" text-anchor="middle" font-size="11" fill="#334155">WRITE AUTHORITY:</text>
<text x="130" y="208" text-anchor="middle" font-size="11" fill="#334155">verified-source code path ONLY</text>
<text x="130" y="223" text-anchor="middle" font-size="11" fill="#334155">that has RE-READ the source</text>
<text x="130" y="253" text-anchor="middle" font-size="11" fill="#334155">never model-written</text>
<text x="130" y="268" text-anchor="middle" font-size="11" fill="#334155">a test that attempts it must fail</text>
<rect x="270" y="80" width="200" height="250" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="370" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">PROCEDURES</text>
<text x="370" y="118" text-anchor="middle" font-size="11" fill="#334155">declarative recipes:</text>
<text x="370" y="133" text-anchor="middle" font-size="11" fill="#334155">preconditions</text>
<text x="370" y="148" text-anchor="middle" font-size="11" fill="#334155">ordered steps</text>
<text x="370" y="163" text-anchor="middle" font-size="11" fill="#334155">validation</text>
<text x="370" y="178" text-anchor="middle" font-size="11" fill="#334155">scope_shown_to_work</text>
<text x="370" y="193" text-anchor="middle" font-size="11" fill="#334155">evaluation_id</text>
<text x="370" y="223" text-anchor="middle" font-size="11" fill="#334155">NOT executable code</text>
<text x="370" y="253" text-anchor="middle" font-size="11" fill="#334155">unmet preconditions</text>
<text x="370" y="268" text-anchor="middle" font-size="11" fill="#334155">-&gt; REFUSE to run (logged)</text>
<rect x="510" y="80" width="200" height="250" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
<text x="610" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">LESSONS</text>
<text x="610" y="118" text-anchor="middle" font-size="11" fill="#334155">accepted ONLY after</text>
<text x="610" y="133" text-anchor="middle" font-size="11" fill="#334155">INDEPENDENT review:</text>
<text x="610" y="148" text-anchor="middle" font-size="11" fill="#334155">review_kind =</text>
<text x="610" y="163" text-anchor="middle" font-size="11" fill="#334155">human | frozen_key |</text>
<text x="610" y="178" text-anchor="middle" font-size="11" fill="#334155">external_signal</text>
<text x="610" y="193" text-anchor="middle" font-size="11" fill="#334155">+ review reference</text>
<text x="610" y="223" text-anchor="middle" font-size="11" fill="#334155">self-critique may PROPOSE</text>
<text x="610" y="238" text-anchor="middle" font-size="11" fill="#334155">it may never ACCEPT</text>
<text x="610" y="268" text-anchor="middle" font-size="11" fill="#334155">no reference -&gt; cannot insert</text>
<rect x="750" y="80" width="200" height="250" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="850" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">HYPOTHESES</text>
<text x="850" y="118" text-anchor="middle" font-size="11" fill="#334155">everything model-generated</text>
<text x="850" y="133" text-anchor="middle" font-size="11" fill="#334155">and unconfirmed</text>
<text x="850" y="163" text-anchor="middle" font-size="11" fill="#334155">ALL SUMMARIES LIVE HERE</text>
<text x="850" y="193" text-anchor="middle" font-size="11" fill="#334155">may inform SEARCH</text>
<text x="850" y="208" text-anchor="middle" font-size="11" fill="#334155">may NEVER appear in an</text>
<text x="850" y="223" text-anchor="middle" font-size="11" fill="#334155">answer's evidence field</text>
<text x="850" y="253" text-anchor="middle" font-size="11" fill="#334155">status: open | promoted |</text>
<text x="850" y="268" text-anchor="middle" font-size="11" fill="#334155">rejected (+ reason)</text>
<rect x="30" y="365" width="920" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="490" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">TEMPORAL VALIDITY — three SQL columns borrowed from Graphiti's bi-temporal model, without the graph database</text>
<text x="490" y="403" text-anchor="middle" font-size="11" fill="#334155">valid_from   ·   valid_to   ·   superseded_by   ·   invalidated_reason        (present on all four stores)</text>
<text x="490" y="418" text-anchor="middle" font-size="11" fill="#334155">A stale fact is CLOSED WITH AN INTERVAL, NEVER DELETED — so &#8220;what did we believe at time T?&#8221; stays answerable</text>
<text x="490" y="433" text-anchor="middle" font-size="11" fill="#334155">Two facts from two document versions with non-overlapping validity are NOT a contradiction (WS04 confusion C8)</text>
<rect x="30" y="480" width="300" height="110" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="180" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">CONTRADICTION HANDLING</text>
<text x="180" y="518" text-anchor="middle" font-size="11" fill="#334155">flag the pair, NEVER merge</text>
<text x="180" y="533" text-anchor="middle" font-size="11" fill="#334155">never silently pick one</text>
<text x="180" y="548" text-anchor="middle" font-size="11" fill="#334155">both records keep their</text>
<text x="180" y="563" text-anchor="middle" font-size="11" fill="#334155">intervals and reasons</text>
<text x="180" y="578" text-anchor="middle" font-size="11" fill="#334155">WS06 requirement 6.7</text>
<rect x="350" y="480" width="300" height="110" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="500" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">QUERY LOG</text>
<text x="500" y="518" text-anchor="middle" font-size="11" fill="#334155">outcome = found | not_found |</text>
<text x="500" y="533" text-anchor="middle" font-size="11" fill="#334155">retrieval_error</text>
<text x="500" y="548" text-anchor="middle" font-size="11" fill="#334155">retrieval failure is DISTINCT</text>
<text x="500" y="563" text-anchor="middle" font-size="11" fill="#334155">from non-existence</text>
<text x="500" y="578" text-anchor="middle" font-size="11" fill="#334155">WS06 requirement 6.8</text>
<rect x="670" y="480" width="280" height="110" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="810" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">POISONING CONTAINMENT</text>
<text x="810" y="518" text-anchor="middle" font-size="11" fill="#334155">writes from retrieved content are</text>
<text x="810" y="533" text-anchor="middle" font-size="11" fill="#334155">quarantined as hypotheses until reviewed</text>
<text x="810" y="548" text-anchor="middle" font-size="11" fill="#334155">no write may alter risk,</text>
<text x="810" y="563" text-anchor="middle" font-size="11" fill="#334155">holding or approval parameters</text>
<text x="810" y="578" text-anchor="middle" font-size="11" fill="#334155">PoisonedRAG arXiv:2402.07867v3</text>
<line x1="130" y1="330" x2="130" y2="363" stroke="#15803d" stroke-width="1.6" marker-end="url(#arg)"/>
<line x1="370" y1="330" x2="370" y2="363" stroke="#15803d" stroke-width="1.6" marker-end="url(#arg)"/>
<line x1="610" y1="330" x2="610" y2="363" stroke="#15803d" stroke-width="1.6" marker-end="url(#arg)"/>
<line x1="850" y1="330" x2="850" y2="363" stroke="#15803d" stroke-width="1.6" marker-end="url(#arg)"/>
<line x1="180" y1="455" x2="180" y2="478" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="500" y1="455" x2="500" y2="478" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="810" y1="455" x2="810" y2="478" stroke="#334155" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="490.0" y="618" text-anchor="middle" font-size="10" fill="#64748b" font-weight="normal">Rejected alternatives: mem0 / cognee / MemOS / A-MEM / MemoryBank (LLM-driven consolidation rewrites or decays records) · Letta server · Graphiti + Neo4j · Zep server</text>
</svg>